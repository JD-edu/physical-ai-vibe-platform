<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;font:13px system-ui;background:#eaf3f8;color:#173047}.bar{display:flex;justify-content:space-between;padding:8px 12px;background:#d9eaf2}canvas{display:block;width:100%;aspect-ratio:4/3;background:#f8fcff}strong{color:#087f8c}</style></head>
<body><div class="bar"><strong>2D 가상 로봇</strong><span id="state">연결 중</span></div><canvas id="field" width="640" height="480"></canvas>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),label=document.querySelector('#state');
let robot={x:0,y:0,heading:0,direction:'stop',speed:0,servo:90},online=false;
function draw(){
  ctx.clearRect(0,0,640,480);ctx.fillStyle='#f8fcff';ctx.fillRect(0,0,640,480);
  ctx.strokeStyle='#deebf2';ctx.lineWidth=1;
  for(let x=40;x<640;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,480);ctx.stroke()}
  for(let y=40;y<480;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(640,y);ctx.stroke()}
  ctx.strokeStyle='#91b8c8';ctx.lineWidth=4;ctx.strokeRect(20,20,600,440);
  const x=320+robot.x*290,y=240+robot.y*210;
  ctx.save();ctx.translate(x,y);ctx.rotate(robot.heading);
  ctx.fillStyle='#40546b';ctx.fillRect(-29,-28,9,56);ctx.fillRect(20,-28,9,56);
  ctx.fillStyle='#087f8c';ctx.beginPath();ctx.roundRect(-23,-33,46,66,9);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(0,-28);ctx.lineTo(-9,-8);ctx.lineTo(9,-8);ctx.fill();
  ctx.strokeStyle='#efaa45';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.sin((robot.servo-90)*Math.PI/180)*25,-Math.cos((robot.servo-90)*Math.PI/180)*25);ctx.stroke();
  ctx.restore();
  label.textContent=online?`${robot.direction} · 속도 ${robot.speed} · 서보 ${robot.servo}°`:'시뮬레이터 연결 끊김';
}
async function poll(){try{const response=await fetch('/api/sim/state',{cache:'no-store'});if(!response.ok)throw Error();robot=await response.json();online=true}catch{online=false}draw()}
poll();setInterval(poll,80);
</script></body></html>
